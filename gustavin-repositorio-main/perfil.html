<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control - Perfil</title>
    <link rel="stylesheet" href="perfil.css">
</head>
<body>
    <header id="cabecao">
        <h1>Perfil do Usuário</h1>
    </header>

    <main class="container">
        <div class="card-perfil">
            <div class="avatar-box">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRWwYRw61B_cjkA2Z9uIxTKrWY2YkfYadBtSKklK1pAKQ&s" alt="Foto de Perfil">
                <h2>Usuário Smart</h2>
                <p>Nível: Aluno</p>
            </div>

            <div class="info-box">
                <div class="info-item">
                    <label>Nome Completo:</label>
                    <input type="text" value="Seu Usuário" readonly>
                </div>

                <div class="info-item">
                    <label>E-mail Corporativo:</label>
                    <input type="email" value="usuario@smartcontrol.com" readonly>
                </div>

                <div class="info-item">
                    <label>Nível de Acesso:</label>
                    <input type="text" value="Aluno" readonly>
                </div>
            </div>

            <div class="acoes-perfil">
                <a href="dashboard.html" class="btn-voltar">← Voltar ao Dashboard</a>
            </div>
        </div>
    </main>
</body>
</html>
