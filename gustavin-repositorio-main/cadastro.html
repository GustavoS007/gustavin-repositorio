<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control</title>
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>
<form id="formCadastro" method="get" action="">
    <div id="card">
    
    <br>
    <br>

    <div class="login quadrados">
        <label for="titulo login" id="login">Cadastro: </label>
    </div>

    <div class="email quadrados">
        <label for="email">E-mail corporativo: </label>
        <input type="email" name="email" required id="email" placeholder="email">
    </div>


    
    <div class="senha quadrados">
        <label for="senha">Senha:</label>
        <input type="password" name="senha" required id="senha" maxlength="10" minlength="8" placeholder="senha">
    </div>
    
    <div class="selecione quadrados">
        <label for="seleção">Selecione seu nivel de acesso</label>
    </div>

    
    <select required name="seleção" id="seleção">
    <p>Nivel de acesso</p>
    <option value="Escolaridade">Aluno</option>
    <option value="Escolaridade">Professor</option>
    
    </select>
    <label for="Aceite os termos" id="termos">Aceite os termos</label>
    
    <input type="checkbox" name="caixinha" id="">

    <button type="submit" id="entrar">Cadastrar-se</button>
    <br>
    </form>
    </div>
    <script src="validacao.js"></script>
</body>
</html>
