<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Control</title>
    <link rel="stylesheet" href="configuracoes.css">
</head>
<body>
    <header id="cabecao">
        <h1>Configurações do Sistema</h1>
    </header>

    <main class="container">
        <div class="card-config">
            <h2>Preferências</h2>

            <form id="form-config">
                <div class="opcoes-box">
                    

                    <div class="opcao-item">
                        <label for="tema">Tema da Interface</label>
                        <select id="tema">
                            <option value="escuro">Escuro (Padrão)</option>
                            <option value="claro">Claro</option>
                        </select>
                    </div>

                    <div class="opcao-item">
                        <label for="linguagem">Idioma</label>
                        <select id="linguagem">
                            <option value="pt-br">Português (Brasil)</option>
                            <option value="en">English</option>
                        </select>
                    </div>
                </div>

                <div class="botoes-box">
                    <button type="submit" id="btn-salvar">Salvar Alterações</button>
                    <a href="dashboard.html" class="btn-voltar">← Voltar ao Dashboard</a>
                </div>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('form-config').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('Configurações salvas com sucesso!');
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
